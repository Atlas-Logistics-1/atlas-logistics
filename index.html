function table(headers,rows){return `<div class="panel table-panel"><div class="table-head"><h3>${headers.title||''}</h3><div class="table-tools">${headers.tools||''}</div></div><table><thead><tr>${headers.cols.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.cols.length}" class="empty">${t('noRecords')}</td></tr>`}</tbody></table><div class="table-foot"><span>${headers.count||0} records</span><span>Demo workspace</span></div></div>`}
function shipmentRows(list){return list.map(s=>`<tr><td><span class="id">${esc(s.id)}</span><span class="sub">${esc(s.weight.toLocaleString())} lbs</span></td><td>${esc(s.customer)}</td><td>${esc(s.origin)}<span class="sub">to ${esc(s.dest)}</span></td><td>${esc(s.pickup)}</td><td>${esc(s.delivery)}</td><td><b>${money(s.rate)}</b></td><td>${statusPill(s.status)}</td><td>${esc(s.driver)}</td><td><button class="link-btn" onclick="editRecord('shipments','${esc(s.id)}')">${t('edit')}</button></td></tr>`).join('')}
function overview(){let active=db.shipments.filter(s=>!['Delivered','Cancelled'].includes(s.status)).length,rev=db.invoices.filter(i=>i.status==='Paid').reduce((a,b)=>a+b.amount,0)+db.shipments.filter(s=>s.status==='Delivered').reduce((a,b)=>a+b.rate,0);let statuses=['Booked','At Pickup','In Transit','Delivered'];let colors=['#8b9bb5','#e4a15f','#3978db','#1a9b72'];return `<div class="page-head"><div><h1>${t('welcome')}</h1><p>${t('subwelcome')}</p></div><button class="btn" onclick="openModal('shipments')">${t('newShipment')}</button></div><div class="cards"><div class="card metric"><div class="metric-top">${t('active')} <span class="metric-icon">▣</span></div><strong>${active}</strong><small>↑ 12% vs last month</small></div><div class="card metric"><div class="metric-top">${t('revenue')} <span class="metric-icon">＄</span></div><strong>${money(rev)}</strong><small>↑ 8.4% vs last month</small></div><div class="card metric"><div class="metric-top">${t('onTime')} <span class="metric-icon">◷</span></div><strong>96.8%</strong><small>↑ 2.1% vs last month</small></div><div class="card metric"><div class="metric-top">${t('driversOn')} <span class="metric-icon">♙</span></div><strong>${db.drivers.filter(d=>d.status==='Available').length}</strong><small>${db.drivers.length} total drivers</small></div></div><div class="grid-main"><div class="panel"><div class="panel-head"><h3>${t('volume')}</h3><span>Last 7 days · Loads</span></div><div class="bars">${[42,60,51,83,68,96,74].map((v,i)=>`<div class="bar-group"><div class="bar ${i===5?'hot':''}" style="height:${v}%"></div><span class="bar-label">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Shipments handled</span><span>Illustrative sample data</span></div></div><div class="panel"><div class="panel-head"><h3>${t('statusBreakdown')}</h3><span>Current</span></div><div class="status-list">${statuses.map((s,i)=>{let n=db.shipments.filter(x=>x.status===s).length,p=db.shipments.length?Math.round(n/db.shipments.length*100):0;return `<div><div class="status-row"><span class="status-left"><i class="status-dot" style="background:${colors[i]}"></i>${s}</span><b>${n}</b></div><div class="progress"><i style="width:${p}%;background:${colors[i]}"></i></div></div>`}).join('')}</div></div></div>${table({title:t('recent'),cols:[t('shipment'),t('customer'),t('lane'),t('pickupDate'),t('deliveryDate'),t('rate'),t('status'),t('driver'),t('actions')],count:db.shipments.length,tools:`<button class="btn secondary small" onclick="setPage('shipments')">${t('viewAll')} →</button>`},shipmentRows(db.shipments.slice(0,5)))}`}
function shipmentsPage(){let list=db.shipments.filter(s=>(filter==='All'||s.status===filter)&&JSON.stringify(s).toLowerCase().includes(search));return `<div class="page-head"><div><h1>${t('shipments')}</h1><p>Manage loads, lanes, pickup windows and delivery status.</p></div><button class="btn" onclick="openModal('shipments')">${t('newShipment')}</button></div>${table({title:`${t('shipments')} (${list.length})`,cols:[t('shipment'),t('customer'),t('lane'),t('pickupDate'),t('deliveryDate'),t('rate'),t('status'),t('driver'),t('actions')],count:list.length,tools:`<select class="filter" onchange="filter=this.value;render()"><option>All</option>${['Booked','At Pickup','In Transit','Delivered','Cancelled'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn secondary small" onclick="exportCSV('shipments')">${t('export')}</button>`},shipmentRows(list))}`}
function simplePage(kind){let cfg={drivers:{title:t('drivers'),cols:[t('name'),t('phone'),t('truck'),t('state'),t('status'),t('actions')],rows:db.drivers,add:t('newDriver'),fields:[['name',t('name')],['phone',t('phone')],['truck',t('truck')],['state',t('state')],['status',t('status'),'select','Available,On Route,Off Duty']]},carriers:{title:t('carriers'),cols:[t('name'),t('mc'),t('dot'),t('state'),t('status'),t('actions')],rows:db.carriers,add:t('newCarrier'),fields:[['name',t('name')],['mc',t('mc')],['dot',t('dot')],['state',t('state')],['status',t('status'),'select','Active,Pending,Inactive']]},customers:{title:t('customers'),cols:[t('name'),t('contact'),t('email'),t('state'),t('terms'),t('actions')],rows:db.customers,add:t('newCustomer'),fields:[['name',t('name')],['contact',t('contact')],['email',t('email')],['state',t('state')],['terms',t('terms'),'select','Net 15,Net 30,Net 45,Due on receipt']]},invoices:{title:t('invoices'),cols:[t('invoice'),t('customer'),t('amount'),t('due'),t('status'),t('actions')],rows:db.invoices,add:t('newInvoice'),fields:[['id',t('invoice')],['customer',t('customer')],['amount',t('amount'),'number'],['due',t('due'),'date'],['status',t('status'),'select','Draft,Sent,Paid,Overdue']]}}[kind];let rows=cfg.rows.filter(x=>JSON.stringify(x).toLowerCase().includes(search)).map((x,i)=>{let vals=kind==='drivers'?[x.name,x.phone,x.truck,x.state,statusPill(x.status)]:kind==='carriers'?[x.name,x.mc,x.dot,x.state,statusPill(x.status)]:kind==='customers'?[x.name,x.contact,x.email,x.state,x.terms]:[x.id,x.customer,money(x.amount),x.due,statusPill(x.status)];return `<tr>${vals.map(v=>`<td>${v}</td>`).join('')}<td><button class="link-btn" onclick="editRecord('${kind}',${i})">${t('edit')}</button> <button class="link-btn" onclick="deleteRecord('${kind}',${i})">${t('delete')}</button>${kind==='invoices'&&x.status!=='Paid'?` <button class="link-btn" onclick="markPaid(${i})">${t('markPaid')}</button>`:''}</td></tr>`}).join('');return `<div class="page-head"><div><h1>${cfg.title}</h1><p>Manage your ${kind} records in one place.</p></div><button class="btn" onclick="openModal('${kind}')">${cfg.add}</button></div>${table({title:cfg.title,cols:cfg.cols,count:cfg.rows.length,tools:`<button class="btn secondary small" onclick="exportCSV('${kind}')">${t('export')}</button>`},rows)}`}
function dispatchPage(){let list=db.shipments.filter(s=>!['Delivered','Cancelled'].includes(s.status));return `<div class="page-head"><div><h1>${t('dispatchTitle')}</h1><p>Assign drivers and coordinate active loads.</p></div><button class="btn secondary" onclick="setPage('shipments')">View all shipments</button></div><div class="cards"><div class="card metric"><div class="metric-top">Unassigned loads</div><strong>${list.filter(x=>x.driver==='Unassigned').length}</strong></div><div class="card metric"><div class="metric-top">Available drivers</div><strong>${db.drivers.filter(x=>x.status==='Available').length}</strong></div><div class="card metric"><div class="metric-top">Loads in transit</div><strong>${list.filter(x=>x.status==='In Transit').length}</strong></div><div class="card metric"><div class="metric-top">At pickup</div><strong>${list.filter(x=>x.status==='At Pickup').length}</strong></div></div>${table({title:'Active load board',cols:[t('shipment'),t('lane'),t('pickupDate'),t('status'),t('driver'),t('actions')],count:list.length},list.map(s=>`<tr><td><span class="id">${s.id}</span><span class="sub">${s.customer}</span></td><td>${s.origin}<span class="sub">to ${s.dest}</span></td><td>${s.pickup}</td><td>${statusPill(s.status)}</td><td>${s.driver}</td><td><button class="link-btn" onclick="assignDriver('${s.id}')">${t('assign')}</button></td></tr>`).join(''))}`}
function quotesPage(){return `<div class="page-head"><div><h1>${t('quotes')}</h1><p>Estimate a US domestic truckload linehaul rate.</p></div></div><div class="panel" style="max-width:760px"><div class="panel-head"><h3>${t('quoteTitle')}</h3><span>USD · miles · lbs</span></div><div class="form"><div class="field"><label>${t('origin')}</label><input id="qOrigin" placeholder="Los Angeles, CA / 90001"></div><div class="field"><label>${t('destination')}</label><input id="qDest" placeholder="Phoenix, AZ / 85001"></div><div class="field"><label>${t('miles')}</label><input id="qMiles" type="number" min="1" value="372"></div><div class="field"><label>${t('weight')}</label><input id="qWeight" type="number" min="1" value="18000"></div><div class="field"><label>${t('equipment')}</label><select id="qEquip"><option value="1">${t('dry')}</option><option value="1.28">${t('reefer')}</option><option value="1.18">${t('flat')}</option></select></div><div class="field"><label>Market factor</label><select id="qMarket"><option value="1">Standard</option><option value="1.15">High demand</option><option value=".92">Backhaul / low demand</option></select></div></div><div style="display:flex;justify-content:space-between;align-items:center;background:#f5f7fa;padding:16px;border-radius:10px;margin-top:18px;gap:12px"><div><small style="color:var(--muted)">${t('estimate')}</small><div id="qResult" style="font-size:26px;font-weight:850">—</div></div><button class="btn" onclick="calculateQuote()">${t('calculate')}</button></div><p style="font-size:10px;color:var(--muted)">${t('disclaimer')}</p></div>`}
function docsPage(){return `<div class="page-head"><div><h1>${t('docsTitle')}</h1><p>${t('docsText')}</p></div><label class="btn" for="docUpload">${t('upload')}</label><input id="docUpload" type="file" multiple hidden onchange="uploadDocs(this.files)"></div><div class="panel"><div class="panel-head"><h3>Uploaded in this session</h3><span id="docCount">0 files</span></div><div id="docList" class="empty">No documents uploaded yet.</div></div>`}
function reportsPage(){let total=db.shipments.reduce((a,s)=>a+s.rate,0),del=db.shipments.filter(s=>s.status==='Delivered').length;return `<div class="page-head"><div><h1>${t('reportsTitle')}</h1><p>Snapshot of sample operational performance.</p></div><button class="btn secondary" onclick="exportCSV('shipments')">${t('download')}</button></div><div class="report-cards"><div class="panel report-card"><span>Gross booked freight value</span><strong>${money(total)}</strong><span>Across ${db.shipments.length} demo loads</span></div><div class="panel report-card"><span>Delivered loads</span><strong>${del}</strong><span>Completed shipments in sample set</span></div><div class="panel report-card"><span>Average shipment value</span><strong>${money(db.shipments.length?total/db.shipments.length:0)}</strong><span>Illustrative metric</span></div></div><div class="panel" style="margin-top:16px"><h3 style="font-size:13px">Shipment status summary</h3>${['Booked','At Pickup','In Transit','Delivered','Cancelled'].map(s=>`<div style="margin:13px 0"><div class="status-row"><span>${s}</span><b>${db.shipments.filter(x=>x.status===s).length}</b></div><div class="progress"><i style="width:${db.shipments.length?db.shipments.filter(x=>x.status===s).length/db.shipments.length*100:0}%"></i></div></div>`).join('')}</div>`}
function settingsPage(){return `<div class="page-head"><div><h1>${t('settingsTitle')}</h1><p>${t('settingsText')}</p></div></div><div class="settings-grid"><div class="panel setting"><h3>Workspace profile</h3><p>Atlas Logistics · United States · USD</p><p>Time zone: America/Chicago (demo preference)</p><p>Measurement: miles and pounds</p></div><div class="panel setting"><h3>${t('language')}</h3><p>Choose the interface language.</p><select class="filter" onchange="lang=this.value;$('language').value=lang;render()"><option value="en" ${lang==='en'?'selected':''}>English</option><option value="ru" ${lang==='ru'?'selected':''}>Русский</option></select></div><div class="panel setting"><h3>Integrations</h3><p>Carrier APIs · EDI · GPS / telematics · Payment gateway</p><span class="pill orange">Not connected</span><p>${t('noLive')}</p></div><div class="panel setting"><h3>Demo data</h3><p>Records are stored locally in this browser using local storage.</p><button class="btn secondary" onclick="resetData()">${t('reset')}</button></div></div>`}
function render(){let views={overview,shipments:shipmentsPage,dispatch:dispatchPage,drivers:()=>simplePage('drivers'),carriers:()=>simplePage('carriers'),customers:()=>simplePage('customers'),invoices:()=>simplePage('invoices'),quotes:quotesPage,documents:docsPage,reports:reportsPage,settings:settingsPage};$('content').innerHTML=(views[page]||overview)();document.querySelectorAll('[data-i]').forEach(el=>{let k=el.dataset.i;if(t(k)!==k)el.textContent=t(k)});$('globalSearch').placeholder=lang==='ru'?'Поиск отправлений, водителей…':'Search shipments, drivers…'}
function fieldsFor(kind){if(kind==='shipments')return [['id','Shipment ID','text','ATL-'+(24086+db.shipments.length)],['customer','Customer','text',''],['origin','Origin (City, ST)','text',''],['dest','Destination (City, ST)','text',''],['pickup','Pickup date','date',new Date().toISOString().slice(0,10)],['delivery','Delivery date','date',new Date(Date.now()+86400000).toISOString().slice(0,10)],['weight','Weight (lbs)','number','10000'],['rate','Rate (USD)','number','1500'],['status','Status','select','Booked,At Pickup,In Transit,Delivered,Cancelled'],['driver','Driver','select',['Unassigned',...db.drivers.map(d=>d.name)].join(',')]];if(kind==='invoices')return [['id','Invoice ID','text','INV-'+(1011+db.invoices.length)],['customer','Customer','text',''],['amount','Amount (USD)','number','1000'],['due','Due date','date',new Date(Date.now()+14*86400000).toISOString().slice(0,10)],['status','Status','select','Draft,Sent,Paid,Overdue']];return ({drivers:[['name','Name'],['phone','Phone'],['truck','Truck / Unit'],['state','State'],['status','Status','select','Available,On Route,Off Duty']],carriers:[['name','Legal name'],['mc','MC Number'],['dot','USDOT Number'],['state','State'],['status','Status','select','Active,Pending,Inactive']],customers:[['name','Company name'],['contact','Contact name'],['email','Email'],['state','State'],['terms','Payment terms','select','Net 15,Net 30,Net 45,Due on receipt']]})[kind]}
function openModal(kind,idx=null){let old=idx!==null?(kind==='shipments'?db.shipments.find(x=>x.id===idx):db[kind][idx]):null;let fs=fieldsFor(kind);let html=fs.map(f=>{let [key,label,type='text',extra='']=f,val=old?.[key]??(typeof extra==='string'?extra:'');if(type==='select')return `<div class="field"><label>${label}</label><select name="${key}">${String(extra).split(',').map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(val)}" ${['id','name'].includes(key)?'required':''}></div>`}).join('');$('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${old?'Edit':'Create'} ${kind.slice(0,-1)}</h2><button class="x" onclick="closeModal()">×</button></div><form id="recordForm" class="form">${html}<div class="field full"><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">${t('cancel')}</button><button class="btn" type="submit">${old?t('save'):t('create')}</button></div></div></form></div></div>`;$('recordForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));fs.forEach(f=>{if(f[2]==='number')data[f[0]]=Number(data[f[0]])});if(kind==='shipments'){let i=db.shipments.findIndex(x=>x.id===old?.id);if(i>=0)db.shipments[i]=data;else db.shipments.unshift(data)}else{let i=old?db[kind].indexOf(old):-1;if(i>=0)db[kind][i]=data;else db[kind].unshift(data)}save();closeModal();render();toast(old?t('updated'):t('created'))}}
function closeModal(){$('modalRoot').innerHTML=''}function editRecord(kind,id){openModal(kind,id)}function deleteRecord(kind,i){if(!confirm(t('confirmDelete')))return;db[kind].splice(i,1);save();render();toast('Record deleted')}function markPaid(i){db.invoices[i].status='Paid';save();render();toast(t('updated'))}function assignDriver(id){let s=db.shipments.find(x=>x.id===id);if(!s)return;let options=db.drivers.map(d=>`<option>${esc(d.name)}</option>`).join('');$('modalRoot').innerHTML=`<div class="modal-wrap"><div class="modal"><div class="modal-head"><h2>${t('assign')} · ${id}</h2><button class="x" onclick="closeModal()">×</button></div><div class="field"><label>${t('driver')}</label><select id="assignSelect">${options}</select></div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="saveAssignment('${id}')">${t('save')}</button></div></div></div>`}function saveAssignment(id){let s=db.shipments.find(x=>x.id===id);s.driver=$('assignSelect').value;let d=db.drivers.find(x=>x.name===s.driver);if(d)d.status='On Route';save();closeModal();render();toast(t('updated'))}
function calculateQuote(){let m=+$('qMiles').value,w=+$('qWeight').value;if(m<=0||w<=0){toast('Enter valid miles and weight');return}let price=Math.round((m*2.35+Math.max(0,w-10000)*.035+450)*+$('qEquip').value*+$('qMarket').value);$('qResult').textContent=money(price)}function exportCSV(kind){let rows=db[kind]||[];if(!rows.length){toast('No records to export');return}let keys=Object.keys(rows[0]);let csv=[keys.join(','),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`atlas-${kind}.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV export ready')}function resetData(){if(!confirm('Reset all locally saved demo data?'))return;db=JSON.parse(JSON.stringify(seed));save();render();toast('Demo data reset')}function uploadDocs(files){let names=[...files].map(f=>`${esc(f.name)} · ${(f.size/1024).toFixed(1)} KB`).join('<br>');$('docList').className='';$('docList').style.padding='15px';$('docList').innerHTML=names;$('docCount').textContent=files.length+' files';toast('Files selected in this browser. Not uploaded to a server.')}
$('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});$('language').addEventListener('change',e=>{lang=e.target.value;render();document.querySelectorAll('#nav button').forEach(b=>b.querySelector('span:last-child').textContent=t(b.dataset.page))});$('globalSearch').addEventListener('input',e=>{search=e.target.value.toLowerCase();if(['shipments','drivers','carriers','customers','invoices'].includes(page))render()});$('mobileMenu').onclick=()=>$('sidebar').classList.toggle('open');$('notify').onclick=()=>toast(t('notifications'));render();document.querySelectorAll('#nav button').forEach(b=>b.querySelector('span:last-child').textContent=t(b.dataset.page));
</script></body></html>
